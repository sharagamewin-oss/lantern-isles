<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lantern Isles</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Tells the browser where to download Three.js from (the 3D library) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- The 3D night sky is drawn on this canvas -->
  <canvas id="scene"></canvas>

  <!-- Top-left: title and lantern counter -->
  <header class="hud hud-top">
    <h1>🏮 Lantern Isles</h1>
    <p class="counter">Lanterns lit: <span id="counter">0</span></p>
  </header>

  <!-- Small hint near the bottom -->
  <p class="hud hint">Drag the sky to look around</p>

  <!-- The main button -->
  <button id="join-btn" class="join-btn" type="button">🏮 Write your wish</button>

  <!-- Small message that appears and disappears -->
  <div id="toast" class="toast"></div>

  <!-- The join form (hidden until you click the button) -->
  <div id="join-modal" class="modal" hidden>
    <form id="join-form" class="modal-card" autocomplete="off">
      <h2>Light your lantern</h2>
      <p class="modal-sub">
        Your name, college and wish will be <strong>public</strong>.
        Please do not write phone numbers or emails.
      </p>

      <label for="name-input">Your name</label>
      <input id="name-input" type="text" maxlength="40" required placeholder="Your name" />

      <label for="college-input">Your college</label>
      <input id="college-input" type="text" maxlength="60" required placeholder="Your college name" />

      <label for="wish-input">Your wish or goal</label>
      <textarea id="wish-input" maxlength="150" rows="3" required
        placeholder="I wish to..."></textarea>
      <p class="char-count"><span id="wish-count">0</span> / 150</p>

      <p id="form-error" class="form-error"></p>

      <div class="btn-row">
        <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
        <button type="submit" id="submit-btn" class="btn-primary">Light my lantern</button>
      </div>
    </form>
  </div>

  <!-- Starts everything -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
