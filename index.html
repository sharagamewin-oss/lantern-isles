<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lantern Isles</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Tells the browser where to download Three.js from (the 3D library) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- The 3D world is drawn on this canvas -->
  <canvas id="scene"></canvas>

  <!-- Top-left: title and lantern counter -->
  <header class="hud hud-top">
    <h1>🏮 Lantern Isles</h1>
    <p class="counter">Lanterns lit: <span id="counter">0</span></p>
  </header>

  <!-- Top-right button to fly down to the island and back -->
  <button id="walk-btn" class="walk-btn" type="button">🚶 Walk</button>

  <!-- Small hint near the bottom (the text changes with the mode) -->
  <p id="hint" class="hud hint">Drag to look around. Tap a lantern to read its wish, or a house to see its room.</p>

  <!-- The mobile joystick (only shown on touch screens while walking) -->
  <div id="joystick" class="joystick" hidden>
    <div id="stick" class="stick"></div>
  </div>

  <!-- The main button -->
  <button id="join-btn" class="join-btn" type="button">🏮 Write your wish</button>

  <!-- Small message that appears and disappears -->
  <div id="toast" class="toast"></div>

  <!-- The join form (hidden until you click the button) -->
  <div id="join-modal" class="modal" hidden>
    <form id="join-form" class="modal-card" autocomplete="off">
      <h2>Light your lantern</h2>
      <p class="modal-sub">
        Your name, college and wish will be <strong>public</strong>.
        Please do not write phone numbers or emails.
      </p>

      <label for="name-input">Your name</label>
      <input id="name-input" type="text" maxlength="40" required placeholder="Your name" />

      <label for="college-input">Your college</label>
      <input id="college-input" type="text" maxlength="60" required placeholder="Your college name" />

      <label for="wish-input">Your wish or goal</label>
      <textarea id="wish-input" maxlength="150" rows="3" required
        placeholder="I wish to..."></textarea>
      <p class="char-count"><span id="wish-count">0</span> / 150</p>

      <p id="form-error" class="form-error"></p>

      <div class="btn-row">
        <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
        <button type="submit" id="submit-btn" class="btn-primary">Light my lantern</button>
      </div>
    </form>
  </div>

  <!-- The popup that shows someone's wish (hidden until you tap a lantern) -->
  <div id="wish-modal" class="modal" hidden>
    <div class="modal-card wish-card">
      <p class="wish-who"><strong id="wish-name"></strong> · <span id="wish-college"></span></p>
      <p id="wish-text" class="wish-text"></p>
      <p id="wish-sparks" class="wish-sparks"></p>

      <div class="btn-row">
        <button type="button" id="wish-close-btn" class="btn-secondary">Close</button>
        <button type="button" id="spark-btn" class="btn-primary">✨ Send spark</button>
      </div>
    </div>
  </div>

  <!-- NEW: the room popup (hidden until you tap a house) -->
  <div id="room-modal" class="modal" hidden>
    <div class="modal-card room-card">
      <h2 id="room-title"></h2>
      <p id="room-college" class="room-college"></p>

      <!-- View mode: shows the skills and projects -->
      <div id="room-view">
        <p class="room-label">Skills</p>
        <p id="room-skills" class="room-text"></p>
        <p class="room-label">Projects</p>
        <p id="room-projects" class="room-text"></p>
      </div>

      <!-- Edit mode: only the owner can open this -->
      <form id="room-form" autocomplete="off" hidden>
        <label for="room-skills-input">Your skills</label>
        <input id="room-skills-input" type="text" maxlength="100"
          placeholder="Example: Python, drawing, Arduino" />

        <label for="room-projects-input">Your projects</label>
        <textarea id="room-projects-input" maxlength="300" rows="4"
          placeholder="What are you building or have built?"></textarea>

        <p id="room-error" class="form-error"></p>

        <div class="btn-row">
          <button type="button" id="room-cancel-btn" class="btn-secondary">Cancel</button>
          <button type="submit" id="room-save-btn" class="btn-primary">Save</button>
        </div>
      </form>

      <!-- Buttons for view mode -->
      <div id="room-buttons" class="btn-row">
        <button type="button" id="room-close-btn" class="btn-secondary">Close</button>
        <button type="button" id="room-edit-btn" class="btn-primary" hidden>✏️ Edit my room</button>
      </div>
    </div>
  </div>

  <!-- Starts everything -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
